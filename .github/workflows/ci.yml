name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Lint backend
        run: uv run ruff check synsc tests
      - name: Type-check backend
        run: uv run mypy synsc
      - name: Audit backend dependencies
        run: |
          audit_requirements="$(mktemp)"
          trap 'rm -f "$audit_requirements"' EXIT
          uv export --quiet --frozen --extra dev --no-hashes --no-header \
            --no-annotate --no-emit-project --output-file "$audit_requirements"
          uvx --from pip-audit==2.10.1 pip-audit -r "$audit_requirements"
      - name: Run backend tests
        run: uv run pytest -q

  postgres:
    name: PostgreSQL contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/delphi_test
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg16-bookworm@sha256:00ba258a66dac104fd5171074a0084462a64a1369d8513f3d0a634e2f24d15bc
        env:
          POSTGRES_DB: delphi_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d delphi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Install locked dependencies
        working-directory: backend
        run: uv sync --locked --extra dev
      - name: Apply bootstrap and migrations
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" \
            --file database/supabase/setup_local.sql
          cd backend
          uv run alembic upgrade head
      - name: Run PostgreSQL concurrency contracts
        working-directory: backend
        run: |
          uv run pytest -q \
            tests/test_atomic_reindex_postgres.py \
            tests/test_job_queue_postgres.py \
            tests/test_paper_access_postgres.py \
            tests/test_snapshot_postgres.py

  mcp-proxy:
    name: MCP proxy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/mcp-proxy
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: packages/mcp-proxy/uv.lock
      - name: Install locked dependencies
        run: uv sync --locked --group dev
      - name: Run proxy tests
        run: uv run pytest -q
      - name: Audit proxy dependencies
        run: |
          audit_requirements="$(mktemp)"
          trap 'rm -f "$audit_requirements"' EXIT
          uv export --quiet --frozen --group dev --no-hashes --no-header \
            --no-annotate --no-emit-project --output-file "$audit_requirements"
          uvx --from pip-audit==2.10.1 pip-audit -r "$audit_requirements"
      - name: Build distributions
        run: uv build

  cli:
    name: CLI package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/cli/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run CLI tests
        run: npm test
      - name: Audit dependencies
        run: npm audit --audit-level=low
      - name: Validate package artifact
        run: npm pack --dry-run

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Enforce lint baseline
        run: npm run lint
      - name: Audit dependencies
        run: npm audit --audit-level=low
      - name: Build production frontend
        run: npm run build

  landing:
    name: Landing site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: landing
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod
      - name: Build production site
        run: pnpm build
      - name: Smoke test production image optimization
        run: |
          pnpm start --hostname 127.0.0.1 > /tmp/delphi-landing.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          if ! curl --retry 30 --retry-connrefused --retry-delay 1 \
            --fail --silent --show-error \
            http://127.0.0.1:3000/ --output /dev/null; then
            cat /tmp/delphi-landing.log
            exit 1
          fi

          headers="$(mktemp)"
          curl --fail --silent --show-error \
            --header "Accept: image/webp" \
            --dump-header "$headers" \
            --output /dev/null \
            "http://127.0.0.1:3000/_next/image?url=%2Fimg%2Fheroes%2Fsacred-way.png&w=828&q=75"
          grep --extended-regexp --ignore-case \
            "^content-type: image/(avif|webp)" "$headers"
